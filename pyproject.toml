[tool.poetry]
name = "yologemma"
version = "0.1.0"
description = "A vision-language model abstraction for object detection and segmentation."
authors = ["Adithya S Kolavi <adithya.s.kolavi@example.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/adithya-s-k/YoloGemma"
homepage = "https://github.com/adithya-s-k/YoloGemma"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = "^3.9"
torch = "2.3.0"
sentencepiece = "*"
tiktoken = "*"
accelerate = "*"
opencv-python = "*"
Pillow = "*"
transformers = "*"
numpy = "*"
gradio = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.poetry.scripts]
download = "YoloGemma.download:main"
main = "YoloGemma.main:main"
server = "YoloGemma.server:main"
gradio = "YoloGemma.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=YoloGemma",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-report=term-missing",
    "--cov-fail-under=80"
]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, may require external resources)",
    "slow: marks tests as slow running tests"
]

[tool.coverage.run]
source = ["YoloGemma"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "*/.env/*",
    "*/site-packages/*",
    "*/dist-packages/*",
    "*/build/*",
    "*/dist/*",
    "*/.*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"